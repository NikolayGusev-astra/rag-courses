middle" fill="#f5f5f5" font-size="15" font-family="Segoe UI, sans-serif">Префилл:</text><text x="660.0" y="248.0" text-anchor="middle" fill="#9aa0a6" font-size="12" font-family="Segoe UI, sans-serif">десятки секунд</text></g><line x1="220" y1="122" x2="300" y2="122" stroke="#9aa0a6" stroke-width="1.5"/>
